# Scenario 1 — tool surface, identity section, and outbound policy.
# Keyless: no LLM adapter, so no model is ever called.
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '../lib/tools.js'
  config: &am
    apiKey: !!js process.env.AGENTMAIL_API_KEY
    inboxId: !!js process.env.AGENTMAIL_INBOX_ID
- name: '../lib/identity.js'
  config: *am
- name: '../lib/approval.js'
  config:
    apiKey: !!js process.env.AGENTMAIL_API_KEY
    requireApprovalForSend: true
    allowedRecipients: ['@agentmail.to']
- name: './probe-tools.js'
